services:
  redis:
    container_name: redis
    image: redis:6.0.9-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - redis_network

  redis_8:
    container_name: redis_8
    image: redis:8.2.1-alpine
    volumes:
      - redis_8_data:/data
    ports:
      - "6380:6379"
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /usr/local/etc/redis
        cat > /usr/local/etc/redis/users.acl <<'EOF'
        user default off
        user root on >root ~* &* +@all
        EOF
        exec redis-server --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    networks:
      - redis_network

networks:
  redis_network:
    name: redis_network
    driver: bridge

volumes:
  redis_data:
    external: true
  redis_8_data:
    external: true