version: "3.8"

services:
  mongodb-7:
    container_name: mongodb-7
    image: mongo:7.0.21-jammy
    volumes:
      - mongodb_7_data:/data/db
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    networks:
      - mongodb_network

networks:
  mongodb_network:
    name: mongodb_network
    driver: bridge

volumes:
  mongodb_7_data:
    external: true
